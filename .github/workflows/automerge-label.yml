name: "Auto Merge (label)"

# pull_request 事件的默认类型不含 labeled，所以"打上 automerge 标签就合并"必须
# 有一个单独的工作流来响应。
#
# 这里只查一次检查结果，不等待：
#   - 已经全部通过 → 直接合并（适用于标签晚于 PR Check 的情况）
#   - 还没跑完 → 不做等待，交给 pr-check.yml（检查跑完后会自动合并）
#
# 合并逻辑与 pr-check.yml 共用 .github/scripts/automerge.cjs。

on:
  pull_request:
    types: [labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    name: "Auto Merge (label)"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Check the commit's checks
        id: checks
        uses: actions/github-script@v9
        with:
          # 只读检查结果，用默认 token 即可
          github-token: ${{ secrets.GITHUB_TOKEN }}
          result-encoding: string
          script: |
            const { checksPassed } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/automerge.cjs`);
            const ok = await checksPassed({
              github,
              core,
              owner: context.repo.owner,
              repo: context.repo.repo,
              pr: context.payload.pull_request,
            });
            return ok ? 'true' : 'false';

      - name: Merge PR
        id: merge
        if: steps.checks.outputs.result == 'true'
        uses: actions/github-script@v9
        with:
          # 改动 .github/workflows/** 的 PR 需要 workflows 权限，GITHUB_TOKEN 没有
          github-token: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { merge } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/automerge.cjs`);
            const merged = await merge({ github, context, core, verifyChecks: false });
            core.setOutput("merged", merged ? "true" : "false");

      - name: Delete merged branch
        if: steps.merge.outputs.merged == 'true'
        uses: actions/github-script@v9
        with:
          # 删除 ref 需要 contents: write
          github-token: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const { deleteHeadBranch } = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/automerge.cjs`);
            await deleteHeadBranch({ github, context, core });
