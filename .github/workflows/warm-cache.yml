name: "Cache Warming"

# 预热 pr-check / publish 用到的缓存。
#
# 缓存 key 必须与 pr-check / publish / nightly 完全一致，否则无法命中。
# 这里显式配置 registry / debug / release 三段缓存，方便核对是否真的写了缓存。

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
  schedule:
    # 每周一 05:00 UTC；stable 工具链更新后缓存键会变，需要定期预热
    - cron: "0 5 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  warm-rust-cache:
    name: "Warm Rust Cache"
    # PR 关闭时只在已合并的情况下预热
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-26.04
    # release 构建带 LTO，留足时间
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust
        id: rust-toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-registry-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Rust debug dependencies
        uses: actions/cache@v6
        with:
          path: |
            target/debug/.fingerprint
            target/debug/deps
            target/debug/build
          key: ${{ runner.os }}-rust-debug-v2-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-debug-v2-${{ steps.rust-toolchain.outputs.cachekey }}-

      - name: Cache Rust release dependencies
        uses: actions/cache@v6
        with:
          path: |
            target/release/.fingerprint
            target/release/deps
            target/release/build
          key: ${{ runner.os }}-rust-release-v2-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-release-v2-${{ steps.rust-toolchain.outputs.cachekey }}-

      # 与 pr-check 一致：build --tests + clippy（clippy 是 PR 里最慢的一步）
      - name: Warm debug cache
        run: |
          cargo fetch
          cargo build --tests
          cargo clippy --all-targets -- -D warnings

      # 与 publish 一致
      - name: Warm release cache
        run: cargo build --release
