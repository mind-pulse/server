name: "Cache Warming"

on:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
  schedule:
    # 每周一 05:00 UTC；stable 工具链更新后缓存键会变，需要定期预热
    - cron: "0 5 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  warm-rust-cache:
    name: "Warm Rust Cache"
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          cache-prefix: rust-debug
          target-dir: debug

      - name: Fetch dependencies
        run: cargo fetch

      - name: Build tests
        run: cargo build --tests
