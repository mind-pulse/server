name: "publish"

# 发布流程（手动触发）：
#   1. 预检：当前提交尚未打标签（nightly 除外）
#   2. 按 bump_type + release_channel 递增 Cargo 版本（prerelease 只递增预发布号）
#   3. 推送 release 分支，生成 changelog，创建草稿 Release
#   4. 构建 Linux x64 产物，可选 UPX，上传 tar.gz 与 sha256
#   5. 发布 Release；alpha/beta 通道删除旧预发布
#   6. release 合回 main，删除 release 分支
on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "版本递增类型（prerelease 只递增预发布号，需配合 alpha/beta 通道）"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
      release_channel:
        description: "发布通道（alpha/beta 标记为预发布）"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - alpha
          - beta
      upx:
        description: "是否用 UPX 压缩产物（默认关闭）"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pre-checks:
    runs-on: ubuntu-26.04
    outputs:
      should_continue: ${{ steps.check.outputs.should_continue }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if release is needed
        id: check
        run: |
          if git describe --tags --exact-match HEAD 2>/dev/null; then
            current_tag=$(git describe --tags --exact-match HEAD 2>/dev/null)
            if [ "$current_tag" = "nightly" ]; then
              echo "should_continue=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::当前提交已打标签 $current_tag，不能重复发布"
              echo "should_continue=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "should_continue=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    needs: pre-checks
    if: needs.pre-checks.outputs.should_continue == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Bump version
        id: version
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
        run: python3 .github/scripts/bump_version.py

      - name: Create and push release branch
        run: |
          set -euo pipefail
          git checkout -b release
          git add Cargo.toml Cargo.lock
          git commit -m "Bump version to $VERSION"
          git push origin release --force

      - name: Build changelog
        id: github_release_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: ".github/changelog-configuration.json"
          failOnError: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        id: create-release
        uses: actions/github-script@v9
        env:
          changelog: ${{ steps.github_release_changelog.outputs.changelog }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.release_channel != 'stable' }}
        with:
          script: |
            const prerelease = process.env.PRERELEASE === "true";
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: "v" + process.env.VERSION,
              name: "v" + process.env.VERSION,
              body: process.env.changelog || "",
              target_commitish: "release",
              draft: true,
              generate_release_notes: false,
              prerelease: prerelease,
              make_latest: prerelease ? "false" : "true",
            });
            console.log("Release created: " + data.id);
            return data.id;

  build:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: release

      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          cache-prefix: rust-release
          target-dir: release

      - name: Install UPX
        if: inputs.upx
        run: |
          sudo apt-get update
          sudo apt-get install -y upx

      - name: Build and package
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail

          cargo build --release
          cd target/release

          if [ "${{ inputs.upx }}" = "true" ]; then
            cp server server.uncompressed
            if upx -9 server && upx -t server; then
              echo "UPX 压缩并校验通过"
            else
              echo "::warning::UPX 压缩或校验失败，使用未压缩产物"
              mv server.uncompressed server
            fi
            rm -f server.uncompressed
          fi

          ASSET="mind-pulse-server-linux-x64-$VERSION.tar.gz"
          tar zcvf "$ASSET" server
          sha256sum "$ASSET" > "$ASSET.sha256"

          echo "ASSET_PATH=$(pwd)/$ASSET" >> "$GITHUB_ENV"
          echo "ASSET_SHA=$(pwd)/$ASSET.sha256" >> "$GITHUB_ENV"

      - name: Upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.create-release.outputs.version }}
          files: |
            ${{ env.ASSET_PATH }}
            ${{ env.ASSET_SHA }}
          prerelease: ${{ inputs.release_channel != 'stable' }}

      - name: Publish Release
        uses: actions/github-script@v9
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
          PRERELEASE: ${{ inputs.release_channel != 'stable' }}
        with:
          script: |
            const prerelease = process.env.PRERELEASE === "true";
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.release_id),
              draft: false,
              prerelease: prerelease,
              make_latest: prerelease ? "false" : "true",
            });

      - name: Drop older pre-releases
        if: inputs.release_channel != 'stable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_TAG: v${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' > /tmp/prereleases.txt
          while read -r tag; do
            if [ -z "$tag" ] || [ "$tag" = "$KEEP_TAG" ]; then
              continue
            fi
            echo "Dropping older pre-release $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          done < /tmp/prereleases.txt

  open-version-pr:
    needs: [create-release, build]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-26.04
    if: success()
    steps:
      - name: Open or update version sync PR
        uses: actions/github-script@v9
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        with:
          # 建 PR、打标签需要 pull-requests/issues 权限；改动 workflow 的 PR 需要 AUTOMERGE_TOKEN
          github-token: ${{ secrets.AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "chore(release): v" + process.env.VERSION;
            const body = "发布 v" + process.env.VERSION + " 后，把 release 分支的版本号同步回 main。由 publish 工作流自动创建，打上 automerge 标签后由检查流程合并。";

            const { data: openPrs } = await github.rest.pulls.list({
              owner,
              repo,
              state: "open",
              head: owner + ":release",
            });

            let pullNumber;
            if (openPrs.length > 0) {
              pullNumber = openPrs[0].number;
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pullNumber,
                title,
                body,
              });
              core.info("更新已有版本同步 PR: #" + pullNumber);
            } else {
              const { data: pr } = await github.rest.pulls.create({
                owner,
                repo,
                head: "release",
                base: "main",
                title,
                body,
              });
              pullNumber = pr.number;
              core.info("创建版本同步 PR: #" + pullNumber);
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: pullNumber,
              labels: ["automerge"],
            });

  summary:
    if: always()
    needs: [pre-checks, create-release, build, open-version-pr]
    runs-on: ubuntu-26.04
    steps:
      - name: Write summary
        run: |
          {
            echo "## 发布结束"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 版本 | v${{ needs.create-release.outputs.version }} |"
            echo "| 通道 | ${{ inputs.release_channel }} |"
            echo "| 递增类型 | ${{ inputs.bump_type }} |"
            echo "| UPX | ${{ inputs.upx }} |"
            echo "| 状态 | ${{ job.status }} |"
          } >> "$GITHUB_STEP_SUMMARY"
