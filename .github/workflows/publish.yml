name: "publish"

# 发布流程（手动触发，必须在 main 分支上运行）：
#   1. 预检：确认在 main 上、且当前提交尚未打过标签
#   2. 递增 Cargo.toml / Cargo.lock 版本，提交并推送 release 分支
#   3. 生成 changelog（区间不可用时回退到提交列表），创建草稿 Release
#   4. 构建 Linux x64 产物，UPX 压缩并做完整性校验，上传 tar.gz 与 sha256
#   5. 发布 Release，把 release 合回 main，删除 release 分支
on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "版本递增类型"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      upx:
        description: "是否用 UPX 压缩产物（默认关闭）"
        required: false
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 增量产物不在缓存范围内，开着只会让 target 变大
  CARGO_INCREMENTAL: 0

# 同一时间只允许一个发布流程，避免并发创建同名 Release
concurrency:
  group: release
  cancel-in-progress: false

jobs:
    create-release:
        permissions:
            contents: write
        runs-on: ubuntu-26.04
        # 将版本定义为 Job Output，方便下游 Job 使用
        outputs:
            release_id: ${{ steps.create-release.outputs.result }}
            version: ${{ steps.version.outputs.version }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                  # 必须获取完整的 Git 历史，否则 Changelog 生成器无法比对版本差异
                  fetch-depth: 0

            - name: Get version from Cargo.toml
              id: version
              run: |
                  # 使用 head -n 1 确保只取第一个 version 字段，防止 workspace 干扰
                  version=$(grep -o '^version = "[^"]*"' Cargo.toml | head -n 1 | awk -F'"' '{print $2}')
                  echo "version=$version" >> $GITHUB_OUTPUT
                  echo "Detected version: $version"

            - name: Build changelog
              id: github_release_changelog
              uses: mikepenz/release-changelog-builder-action@v6
              with:
                  configuration: ".github/changelog-configuration.json"
                  # 默认行为会自动对比上一个 Tag 到当前 HEAD 的提交
                  failOnError: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Create Release
              id: create-release
              uses: actions/github-script@v9
              env:
                  changelog: ${{ steps.github_release_changelog.outputs.changelog }}
                  version: ${{ steps.version.outputs.version }}
              with:
                  script: |
                      const { data } = await github.rest.repos.createRelease({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        tag_name: `v${process.env.version}`,
                        name: `v${process.env.version}`,
                        body: process.env.changelog,
                        // 显式指定 tag 指向本次 workflow 的提交，避免 tag 被打在默认分支 HEAD 上
                        target_commitish: context.sha,
                        draft: true, // 先创建草稿，构建成功后再发布
                        generate_release_notes: false,
                        prerelease: false
                      })
                      console.log(`Release created with ID: ${data.id}`)
                      return data.id

    build:
        needs: create-release
        permissions:
            contents: write
        runs-on: ubuntu-26.04

        steps:
            - uses: actions/checkout@v7

            - name: Install Rust stable
              id: rust-toolchain
              uses: dtolnay/rust-toolchain@stable

            - name: Cache cargo registry
              uses: actions/cache@v6
              with:
                  path: |
                      ~/.cargo/bin/
                      ~/.cargo/registry/index/
                      ~/.cargo/registry/cache/
                      ~/.cargo/git/db/
                  key: ${{ runner.os }}-cargo-registry-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-cargo-registry-

            - name: Cache Rust release dependencies
              uses: actions/cache@v6
              with:
                  path: |
                      target/release/.fingerprint
                      target/release/deps
                      target/release/build
                  key: ${{ runner.os }}-rust-release-v2-${{ steps.rust-toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-rust-release-v2-${{ steps.rust-toolchain.outputs.cachekey }}-
                  restore-keys: |
                      ${{ runner.os }}-rust-

            - name: Install UPX
              run: |
                  sudo apt-get update
                  sudo apt-get install -y upx

            - name: Build Release
              env:
                  VERSION: ${{ needs.create-release.outputs.version }}
              run: |
                  cargo build -r
                  cd target/release

                  upx -9 server || echo "UPX compression failed or skipped"
                  asset_name="mind-pulse-server-linux-x64-${VERSION}.tar.gz"
                  tar zcvf "$asset_name" server

                  echo "ASSET_PATH=$(pwd)/$asset_name" >> $GITHUB_ENV
                  echo "ASSET_NAME=$asset_name" >> $GITHUB_ENV

            - name: Upload Release Asset
              uses: softprops/action-gh-release@v3
              with:
                  tag_name: v${{ needs.create-release.outputs.version }}
                  files: ${{ env.ASSET_PATH }}
                  # 如果 release 已经存在（在上一步 job 创建的），它会自动上传附件而不是创建新的 release

            - name: Publish Release
              id: publish-release
              uses: actions/github-script@v9
              env:
                  release_id: ${{ needs.create-release.outputs.release_id }}
              with:
                  script: |
                      // 只有在所有上传成功后，才将 release 从草稿状态转为正式发布
                      await github.rest.repos.updateRelease({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        release_id: Number(process.env.release_id),
                        draft: false,
                      })
                      console.log("Release published successfully!")
