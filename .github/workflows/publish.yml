name: "publish"

# 发布流程（手动触发，必须在 main 分支上运行）：
#   1. 预检：确认在 main 上、且当前提交尚未打过标签
#   2. 递增 Cargo.toml / Cargo.lock 版本，提交并推送 release 分支
#   3. 生成 changelog（区间不可用时回退到提交列表），创建草稿 Release
#   4. 构建 Linux x64 产物，UPX 压缩并做完整性校验，上传 tar.gz 与 sha256
#   5. 发布 Release，把 release 合回 main，删除 release 分支
on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: "版本递增类型"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 增量产物不在缓存范围内，开着只会让 target 变大
  CARGO_INCREMENTAL: 0

# 同一时间只允许一个发布流程，避免并发创建同名 Release
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pre-checks:
    runs-on: ubuntu-24.04
    outputs:
      should_continue: ${{ steps.check.outputs.should_continue }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check release preconditions
        id: check
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::error::请在 main 分支上手动触发发布（当前：$GITHUB_REF_NAME）"
            exit 1
          fi

          if git describe --tags --exact-match HEAD >/dev/null 2>&1; then
            echo "HEAD 已打过标签，跳过本次发布"
            echo "should_continue=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_continue=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    needs: pre-checks
    if: needs.pre-checks.outputs.should_continue == 'true'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.bump.outputs.version }}
      changelog: ${{ steps.final_changelog.outputs.changelog }}
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Bump version
        id: bump
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          set -euo pipefail

          CURRENT=$(grep -m1 '^version = "' Cargo.toml | sed -E 's/^version = "([^"]+)"/\1/')
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          case "$BUMP_TYPE" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "::error::未知的递增类型：$BUMP_TYPE"; exit 1 ;;
          esac

          VERSION="$MAJOR.$MINOR.$PATCH"

          if git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "::error::标签 v$VERSION 已存在，请检查版本号"
            exit 1
          fi

          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml

          # Cargo.lock 里也记录着本包版本，一并同步，避免提交出去的 lock 与 manifest 不一致
          python3 - "$VERSION" <<'PY'
          import pathlib, re, sys

          version = sys.argv[1]
          lock = pathlib.Path('Cargo.lock')
          if lock.exists():
              text = lock.read_text()
              text = re.sub(
                  r'(\[\[package\]\]\nname = "server"\nversion = ")[^"]+(")',
                  rf'\g<1>{version}\g<2>',
                  text,
              )
              lock.write_text(text)
          PY

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "版本：$CURRENT -> $VERSION"

      - name: Create and push release branch
        id: release_branch
        run: |
          set -euo pipefail

          git checkout -b release
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version }}"
          git push origin release --force

          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Determine changelog range
        id: changelog_range
        run: |
          set -euo pipefail

          LAST_TAG=$(git describe --tags --abbrev=0 --exclude="nightly" refs/heads/main 2>/dev/null || echo "")

          if [ -n "$LAST_TAG" ] && git merge-base --is-ancestor "$LAST_TAG" refs/heads/main 2>/dev/null; then
            echo "fromTag=$LAST_TAG" >> "$GITHUB_OUTPUT"
            echo "changelog 起点：$LAST_TAG"
          else
            ROOT_COMMIT=$(git rev-list --max-parents=0 refs/heads/main)
            echo "fromTag=$ROOT_COMMIT" >> "$GITHUB_OUTPUT"
            echo "没有可用标签，changelog 起点：$ROOT_COMMIT"
          fi

      - name: Build changelog
        id: github_release_changelog
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configuration: ".github/changelog-configuration.json"
          fromTag: ${{ steps.changelog_range.outputs.fromTag }}
          toTag: "refs/heads/release"
          failOnError: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fallback changelog from commits
        id: fallback_changelog
        if: steps.github_release_changelog.outputs.changelog == ''
        uses: actions/github-script@v9
        env:
          FROM: ${{ steps.changelog_range.outputs.fromTag }}
        with:
          result-encoding: string
          script: |
            const { execSync } = require('child_process');

            const from = process.env.FROM;
            const log = execSync(`git log ${from}..HEAD --pretty=format:"%h %s"`)
              .toString()
              .trim();

            const sections = {
              feat: '🚀 Features',
              fix: '🐛 Bug Fixes',
              perf: '⚡ Performance',
              refactor: '♻️ Refactor',
              docs: '📖 Documentation',
              chore: '🔧 Chore',
              ci: '👷 CI',
              test: '🧪 Tests',
              style: '🎨 Styles',
            };
            const order = Object.keys(sections);
            const buckets = {};

            for (const line of log.split('\n').filter(Boolean)) {
              const parts = line.split(' ');
              const msg = parts.slice(1).join(' ');
              const match = msg.match(/^([a-z]+)[(:!]/);
              const prefix = match && order.includes(match[1]) ? match[1] : 'other';
              buckets[prefix] = buckets[prefix] || [];
              buckets[prefix].push(`- ${msg}`);
            }

            let changelog = '';
            for (const prefix of order) {
              if (buckets[prefix]?.length) {
                changelog += `## ${sections[prefix]}\n${buckets[prefix].join('\n')}\n\n`;
              }
            }

            core.setOutput('changelog', changelog || '本次发布没有可列出的变更。');

      - name: Set final changelog
        id: final_changelog
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          GENERATED: ${{ steps.github_release_changelog.outputs.changelog }}
          FALLBACK: ${{ steps.fallback_changelog.outputs.changelog }}
        run: |
          set -euo pipefail

          CHANGELOG="${GENERATED:-$FALLBACK}"
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="本次发布没有可列出的变更。"
          fi

          {
            echo "changelog<<EOF"
            echo "$CHANGELOG"
            echo ""
            echo "### 下载"
            echo ""
            echo "- \`mind-pulse-server-linux-x64-${VERSION}.tar.gz\`"
            echo "- \`mind-pulse-server-linux-x64-${VERSION}.tar.gz.sha256\`"
            echo ""
            echo "解压后运行 \`./server\`，默认监听 4819 端口；可用 \`./server 9999\` 指定其他端口。"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        id: create-release
        uses: actions/github-script@v9
        env:
          changelog: ${{ steps.final_changelog.outputs.changelog }}
          VERSION: ${{ steps.bump.outputs.version }}
          TARGET_SHA: ${{ steps.release_branch.outputs.sha }}
        with:
          retries: 3
          retry-exempt-status-codes: 400,401,403,404,422
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.VERSION}`,
              name: `v${process.env.VERSION}`,
              body: process.env.changelog,
              // 明确指向 release 分支上的版本提交，避免 tag 落在 main 的旧提交上
              target_commitish: process.env.TARGET_SHA,
              draft: true,
              prerelease: false,
              generate_release_notes: false,
            });

            console.log(`Created draft release ${data.id} for v${process.env.VERSION}`);
            return data.id;

  build:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release

      - name: Setup Rust
        uses: ./.github/actions/rust-setup
        with:
          cache-prefix: rust-release
          target-dir: release

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y upx

      - name: Build and package
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail

          cargo build --release
          cd target/release

          # UPX 就地压缩：先备份，压缩或校验失败时回退到未压缩产物
          cp server server.uncompressed
          if upx -9 server && upx -t server; then
            echo "UPX 压缩并校验通过"
          else
            echo "::warning::UPX 压缩或校验失败，使用未压缩产物"
            mv server.uncompressed server
          fi
          rm -f server.uncompressed

          ASSET="mind-pulse-server-linux-x64-${VERSION}.tar.gz"
          tar zcvf "$ASSET" server
          sha256sum "$ASSET" > "$ASSET.sha256"

          echo "ASSET_PATH=$(pwd)/$ASSET" >> "$GITHUB_ENV"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "v${VERSION}" \
            "${ASSET_PATH}" "${ASSET_PATH}.sha256" \
            --clobber

  publish:
    needs: [create-release, build]
    if: success()
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Publish release
        uses: actions/github-script@v9
        env:
          release_id: ${{ needs.create-release.outputs.release_id }}
        with:
          retries: 3
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.release_id),
              draft: false,
            });

  update-main:
    needs: publish
    if: success()
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge release into main
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git fetch origin release:release
          git merge release --ff-only
          git push origin main

  cleanup-release-branch:
    needs: update-main
    if: success()
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Delete release branch
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: 'heads/release',
              });
              console.log('release 分支已删除');
            } catch (error) {
              console.log(`删除 release 分支失败：${error.message}`);
            }

  summary:
    if: always()
    needs: [pre-checks, create-release, build, publish, update-main, cleanup-release-branch]
    runs-on: ubuntu-24.04
    steps:
      - name: Write workflow summary
        run: |
          set -euo pipefail

          VERSION="${{ needs.create-release.outputs.version }}"

          {
            echo "## 🚀 发布流程结束"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 状态 | ${{ job.status }} |"
            echo "| 版本 | ${VERSION:-—} |"
            echo "| 触发人 | ${{ github.actor }} |"
            echo "| 递增类型 | ${{ inputs.bump_type }} |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${{ needs.publish.result }}" = "success" ]; then
            echo "✅ 已发布：https://github.com/${{ github.repository }}/releases/tag/v${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ 未完成发布（publish: ${{ needs.publish.result }}）" >> "$GITHUB_STEP_SUMMARY"
          fi
